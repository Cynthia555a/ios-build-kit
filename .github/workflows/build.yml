name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: compile-ipa
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ipa
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: "*.ipa"
          if-no-files-found: error
